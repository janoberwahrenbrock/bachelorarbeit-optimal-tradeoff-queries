name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -e . --group dev
      - name: Unit and contract tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests tools build_support.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/otqa-wheel"
          "$RUNNER_TEMP/otqa-wheel/bin/python" -m pip install dist/*.whl
          cp tools/validation/installed_smoke.py "$RUNNER_TEMP/otqa-installed-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/otqa-wheel/bin/otqa" --help
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
            VECLIB_MAXIMUM_THREADS=1 BLIS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            "$RUNNER_TEMP/otqa-wheel/bin/python" -I "$RUNNER_TEMP/otqa-installed-smoke.py"
