[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bachelorarbeit-optimal-tradeoff-queries"
version = "0.2.0"
description = "Optimal Tradeoff Queries with exact geometric probabilities and reproducible experiments"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license-files = ["THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
dependencies = [
  "numpy>=2.4,<2.6",
  "scipy>=1.17,<1.19",
  "jsonschema==4.26.0",
]

[project.scripts]
otqa = "otqa.cli:main"

[project.urls]
Repository = "https://github.com/janoberwahrenbrock/bachelorarbeit-optimal-tradeoff-queries"

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.6.1", "ruff==0.17.0", "setuptools==84.0.0", "wheel==0.48.0"]

[tool.setuptools]
# The build-only command module is resolved at the repository root.
package-dir = {"" = "src", build_support = "build_support"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["otqa*"]

[tool.setuptools.package-data]
otqa = ["schemas/*.json", "_source_inventory.json", "_build_provenance.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: explicitly selected longer numerical or process tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
sdist = "build_support.SourceDist"
